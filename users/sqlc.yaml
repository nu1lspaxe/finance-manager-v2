version: "2"
sql:
  - engine: "postgresql"
    queries: "postgres/query.sql"
    schema: "postgres/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "postgres/sqlc"
        sql_package: "pgx/v5"
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_json_tags: true
        overrides:
          - db_type: "pg_catalog.numeric"  
            go_type: 
              type: "float32"
          - db_type: "bigint"
            go_type: 
              type: "int64"